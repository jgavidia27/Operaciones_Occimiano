services:
  - type: web
    name: occimiano-sto-mobile
    runtime: python
    plan: free
    # Fijamos Python 3.12 (via runtime.txt) — Python 3.14 en Render rompe
    # el render de Jinja2 3.x (traceback en templating.py -> environment.py).
    # Fijamos también Flask + Jinja2 + Werkzeug para builds reproducibles.
    buildCommand: pip install "flask==3.0.3" "jinja2==3.1.4" "werkzeug==3.0.4" "gunicorn==22.0.0" "requests==2.32.3"
    startCommand: gunicorn mobile_sto:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
