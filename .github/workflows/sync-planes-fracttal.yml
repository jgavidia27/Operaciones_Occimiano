name: Sync Planes Fracttal → Google Sheet

# Refleja la configuración vigente de los Planes de Tareas de Fracttal en un
# Google Sheet. Corre TODOS los días a las ~07:00 hora Chile.
# Chile invierno UTC-4 → 11:00 UTC = 07:00 CLT
# Chile verano  UTC-3 → 11:00 UTC = 08:00 CLT   (aceptable)
on:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC diario (~07:00-08:00 CLT)
  workflow_dispatch:           # permite ejecutar manualmente desde la UI
    inputs:
      dry_run:
        description: "Modo prueba (NO escribe el Sheet, solo vuelca CSV)"
        type: boolean
        default: false

jobs:
  sync-planes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl google-api-python-client google-auth

      - name: Run sync planes Fracttal
        env:
          FRACTTAL_CLIENT_ID:          ${{ secrets.FRACTTAL_CLIENT_ID }}
          FRACTTAL_CLIENT_SECRET:      ${{ secrets.FRACTTAL_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PLANES_SHEET_ID:             ${{ secrets.PLANES_SHEET_ID }}
        run: |
          ARGS=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="--dry-run"
          fi
          echo "Ejecutando: python sync_planes_fracttal.py $ARGS"
          python sync_planes_fracttal.py $ARGS

      - name: Upload CSV backup on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: planes-fracttal-csv
          path: |
            _planes_resumen.csv
            _planes_desglose.csv
          retention-days: 7
          if-no-files-found: ignore
